# Builds the tiles from the Natural Earth raster, checks them, and makes the release v<version> on GitHub with:
#
# - ne2sr.pmtiles: the WebP tiles as one PMTiles archive
# - ne2sr-ofm.tar.gz: ofm/ne2sr/{z}/{x}/{y}.webp and .png (the WebP decoded), as the natural_earth asset of OpenFreeMap
# - ne2sr.build.json: the settings and the versions of the tools
# - SHA256SUMS
#
# Start it from the Actions tab (Run workflow, on main) with the version.
name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version of the tiles, such as 1.0.0. The release is v<version>.'
        required: true
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      # The job pushes the tag and makes the release.
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: The version is new
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::A release is made from main only, and this run is on $GITHUB_REF."; exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version is $VERSION; it must be like 1.0.0."; exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::The release v$VERSION exists."; exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover tests
      - name: Download the source
        run: echo "SOURCE=$(python scripts/fetch.py ne2sr work/src)" >> "$GITHUB_ENV"
      - run: python scripts/build.py --source "$SOURCE" --out work/out
      - run: python scripts/check.py --out work/out
      - name: Package
        run: |
          mkdir work/release
          # The same bytes for the same tiles: sorted names, fixed times and owners, no name or time in the gzip header.
          tar --sort=name --mtime='2012-07-16 00:00Z' --owner=0 --group=0 --numeric-owner -C work/out -cf - ofm \
            | gzip -n -9 > work/release/ne2sr-ofm.tar.gz
          cp work/out/ne2sr.pmtiles work/out/ne2sr.build.json work/release/
          (cd work/release && sha256sum * > SHA256SUMS)
          ls -l work/release
      - name: Make the release
        run: |
          {
            echo "Natural Earth II with Shaded Relief (1:10m) as Web Mercator tiles of 512 pixels, zooms 0 to 6."
            echo
            echo "Source: \`$(jq -r .ne2sr.url sources.json)\` (Natural Earth raster $(jq -r .ne2sr.version sources.json)), SHA-256 \`$(jq -r .ne2sr.sha256 sources.json)\`."
            echo
            echo '```'
            cat work/release/SHA256SUMS
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" work/release/* --target "$GITHUB_SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
